[package]
name = "cc-router"
version = "4.8.0"
description = "多订阅聚合代理 · 让 Claude Code 无缝调用多家厂商订阅"
authors = ["cc-router"]
edition = "2021"
# 依赖树的实际下限: time 0.3.47 / time-core 0.1.8 声明 MSRV 1.88, 低于此版本 cargo 直接拒绝构建.
rust-version = "1.88.0"

[lib]
name = "cc_router_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 钉住以规避 bitflags>=2.10 的 named-flags 递归宏撞穿 dispatch2 0.3.1 的 recursion_limit
bitflags = "=2.9.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
# Rust 侧用 tauri_plugin_os::locale() 做托盘菜单的系统语言探测 (tray::TrayLocale::from_pref);
# 该函数是 sys_locale 的纯封装, 不依赖 plugin 注册, 但 plugin 保留着以便前端随时取 OS 信息.
# 注: 该 plugin 的 MSRV (1.77.2) 曾是本 crate rust-version 的来源, 现已被 time 的 1.88 超过.
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# 用于 Codex config.toml 编辑器: 保留注释 / 字段顺序 / 空行 (用户可能手写过 profile).
toml_edit = "0.22"

tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["http2", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }
bytes = "1"
futures = "0.3"

# TLS 信任取并集: rustls-tls(=webpki 内置根证书) + rustls-tls-native-roots(操作系统证书库).
# 后者让企业内网私有 CA (系统已信任) 可用 (issue #34); 前者保证系统证书库缺失/为空时仍有兜底.
# reqwest 0.12 两个 feature 并存时把两套根证书都加进 root store (tls_built_in_certs_webpki/native 默认均开).
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "rustls-tls-native-roots"] }

# 本地 TLS 监听 (HTTPS 模式). rustls 与 reqwest/tokio-rustls 间接引入版本对齐, cargo tree 实测 rustls 0.23.39 + tokio-rustls 0.26.4.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = { version = "0.3", features = ["macros"] }
sha2 = "0.10"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }

jsonschema = { version = "0.18", default-features = false }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"

thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
async-trait = "0.1"
base64 = "0.22"
crc32fast = "1.4"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
# SAN e2e 用: 解析 leaf.pem 验证 SAN 列表. 已经被 rcgen feature 间接引入, 这里显式声明给 tests 用.
x509-parser = "0.16"
pem = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
