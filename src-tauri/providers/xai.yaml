id: xai
display_name: "xAI Grok"
icon: xai
category: first_party
description: "xAI Grok 官方 API · Anthropic 兼容端点"
homepage: "https://x.ai"
docs_url: "https://docs.x.ai"
api_key_url: "https://console.x.ai"

compatibility: untested
compatibility_notes: |
  Anthropic 兼容端点 (api.x.ai/v1/messages) 为官方半文档化状态: 旧版迁移指南明确支持
  Anthropic SDK (base_url 设 https://api.x.ai), 新版 REST reference 未列出但端点实测存活
  (2026-07 探测: 空 body 返回 Anthropic 风格 400 校验错误, x-api-key 与 Bearer 均可携带凭据)。
  流式 SSE 字节格式 / tool_use / thinking 支持程度未实测, 待有 key 用户反馈。

endpoints:
  - id: anthropic_endpoint
    label: "国际版 · 按量付费 API"
    description: "xAI 官方 Anthropic Messages 兼容端点"
    base_url: "https://api.x.ai"
    messages_path: "/v1/messages"
    region: global
    billing: pay_as_you_go

default_endpoint: anthropic_endpoint

auth:
  type: api_key
  header_name: "Authorization"
  # 实测 x-api-key 和 Authorization: Bearer 都接受, 选 bearer 与其他第三方厂商保持一致
  header_format: bearer

required_headers:
  anthropic-version: "2023-06-01"

forward_headers: []

model_discovery:
  enabled: true
  # GET https://api.x.ai/v1/models 与 messages 同域, OpenAI 风格 {data:[{id,...}]}
  path: "/v1/models"
  cache_ttl_hours: 24
  # 来源: https://docs.x.ai/developers/models (2026-07 核对)
  example_models:
    - "grok-4.5"
    - "grok-4.3"
    - "grok-4.20-0309-reasoning"
    - "grok-build-0.1"
